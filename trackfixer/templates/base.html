<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if run_is_going %}<meta http-equiv="refresh" content="5">{% endif %}
  <title>{% block title %}Track fixer{% endblock %}</title>
  <style>
    :root {
      --background: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
      --border: #e2e2dc; --accent: #2f6fdb; --ok: #1f8a4c; --warning: #b26a00; --error: #c4372c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #161615; --surface: #20201e; --text: #ececea; --muted: #9a9a94;
        --border: #34342f; --accent: #6b9bf0; --ok: #4cc27f; --warning: #e0a03c; --error: #ef6b60;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--background); color: var(--text);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    nav { display: flex; gap: 20px; align-items: baseline; padding: 12px 0 20px; }
    nav strong { font-size: 17px; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h2 { font-size: 16px; margin: 28px 0 10px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
    .muted { color: var(--muted); }
    .flash { background: var(--surface); border-left: 3px solid var(--accent); padding: 10px 14px; margin-bottom: 12px; }
    .running { border-left-color: var(--warning); }
    .table-wrapper { overflow-x: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { font-weight: 600; color: var(--muted); font-size: 13px; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    td.number, th.number { text-align: right; font-variant-numeric: tabular-nums; }
    .nowrap { white-space: nowrap; }
    .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 13px; border: 1px solid currentColor; white-space: nowrap; }
    .ok, .in_dawarich, .info { color: var(--ok); }
    .warnings, .warning, .planned { color: var(--warning); }
    .failed, .error { color: var(--error); }
    .skipped, .removed, .running-outcome { color: var(--muted); }
    button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--background); color: var(--text); cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    form { margin: 0; }
    .form-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
    dt { color: var(--muted); }
    dd { margin: 0; overflow-wrap: anywhere; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 12px; }
  </style>
</head>
<body>
<main>
  <nav>
    <strong>Track fixer</strong>
    <a href="{{ url_for('overview') }}">Overview</a>
    <a href="{{ url_for('trips') }}">Trips</a>
  </nav>
  {% for message in get_flashed_messages() %}<div class="flash">{{ message }}</div>{% endfor %}
  {% if run_is_going %}<div class="flash running">A run is going. This page refreshes every 5 seconds.</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
